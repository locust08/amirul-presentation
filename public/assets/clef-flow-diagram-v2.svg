<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Clef e-commerce website flow diagram</title>
  <desc id="desc">A diagram showing the customer connecting through Cloudflare to the Clef frontend, which draws content from Payload CMS and commerce data from Medusa.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#fffaf0"/></linearGradient>
    <linearGradient id="dark" x1="0" x2="1"><stop stop-color="#242b2e"/><stop offset="1" stop-color="#3f494b"/></linearGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#ffcf3d"/><stop offset="1" stop-color="#f2aa05"/></linearGradient>
    <linearGradient id="payload" x1="0" x2="1"><stop stop-color="#faf5ff"/><stop offset="1" stop-color="#f1e8ff"/></linearGradient>
    <linearGradient id="medusa" x1="0" x2="1"><stop stop-color="#fff3f4"/><stop offset="1" stop-color="#ffe5ea"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#202326" flood-opacity=".13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5 0 10z" fill="#303638"/></marker>
    <style>
      .box{filter:url(#shadow);stroke-width:2}.head{font:700 25px Arial,sans-serif;fill:#202326}.sub{font:500 17px Arial,sans-serif;fill:#555d61}.tiny{font:600 16px Arial,sans-serif;fill:#4e565a}.caps{font:800 15px Arial,sans-serif;letter-spacing:3px;fill:#a87600}.line{stroke:#303638;stroke-width:3;fill:none;marker-end:url(#arrow)}.bullet{font:600 16px Arial,sans-serif;fill:#4e565a}.badge{font:800 14px Arial,sans-serif;fill:#202326}.footer{font:700 20px Arial,sans-serif;fill:#293033}
    </style>
  </defs>
  <rect width="1600" height="900" rx="30" fill="url(#paper)"/>
  <path d="M0 0H1600V55C1260 105 1020 34 742 70C443 108 235 114 0 60Z" fill="#fff8e7"/>
  <text x="800" y="76" text-anchor="middle" class="caps">CLEF E-COMMERCE ARCHITECTURE</text>
  <text x="800" y="117" text-anchor="middle" class="head" style="font-size:36px">How the Clef website works together</text>

  <path class="line" d="M800 201V246"/>
  <path class="line" d="M800 326V379"/>
  <path class="line" d="M600 452H525V526"/>
  <path class="line" d="M1000 452H1075V526"/>
  <path class="line" d="M525 702V751H700V702"/>
  <path class="line" d="M1075 702V751H900V702"/>
  <path class="line" d="M785 455V751"/>
  <path class="line" d="M815 455V751"/>
  <path class="line" d="M212 588H330"/>
  <path class="line" d="M1388 588H1270"/>

  <g filter="url(#shadow)"><rect x="650" y="133" width="300" height="68" rx="16" fill="#fff3f4" stroke="#ee718d" class="box"/><circle cx="697" cy="167" r="18" fill="none" stroke="#dc4c76" stroke-width="4"/><path d="M674 189c5-21 41-21 46 0" fill="none" stroke="#dc4c76" stroke-width="4"/><text x="745" y="174" class="head">Customer / User</text></g>
  <g filter="url(#shadow)"><rect x="612" y="246" width="376" height="80" rx="16" fill="#fff5e7" stroke="#f4a71c" class="box"/><path d="M646 289c9-20 27-25 42-15 13-12 34-4 35 15h-77z" fill="#f6a21b"/><text x="748" y="281" class="head">Cloudflare</text><text x="748" y="305" class="sub">DNS · SSL · CDN · security</text></g>
  <g filter="url(#shadow)"><rect x="580" y="379" width="440" height="76" rx="18" fill="url(#gold)" class="box" stroke="#edaa08"/><path d="M628 411h29v29h-29z" fill="none" stroke="#202326" stroke-width="4"/><path d="M634 411c0-16 17-16 17 0" fill="none" stroke="#202326" stroke-width="4"/><text x="685" y="414" class="head" style="font-size:29px">clef-ecommerce</text><text x="685" y="438" class="sub">Frontend storefront</text></g>

  <g filter="url(#shadow)"><rect x="330" y="526" width="390" height="176" rx="20" fill="url(#payload)" class="box" stroke="#8e62d4"/><rect x="358" y="553" width="48" height="55" rx="8" fill="none" stroke="#7c4cc0" stroke-width="4"/><path d="M369 568h26M369 581h26M369 594h18" stroke="#7c4cc0" stroke-width="4"/><text x="430" y="568" class="head" style="font-size:27px">clef-payload</text><text x="430" y="593" class="sub">Content CMS</text><path d="M358 613H690" stroke="#cbb6ee" stroke-width="2"/><text x="373" y="642" class="bullet">• Homepage banners &amp; promotions</text><text x="373" y="667" class="bullet">• Media, category content &amp; footer</text></g>
  <g filter="url(#shadow)"><rect x="880" y="526" width="390" height="176" rx="20" fill="url(#medusa)" class="box" stroke="#ee718d"/><path d="M914 562h48l-5 40h-38z" fill="none" stroke="#dc4c76" stroke-width="4"/><circle cx="926" cy="616" r="6" fill="#dc4c76"/><circle cx="950" cy="616" r="6" fill="#dc4c76"/><text x="987" y="568" class="head" style="font-size:27px">clef-medusa</text><text x="987" y="593" class="sub">Commerce backend</text><path d="M908 632H1242" stroke="#f2b5c4" stroke-width="2"/><text x="923" y="658" class="bullet">• Products · categories · pricing · cart</text><text x="923" y="683" class="bullet">• Checkout · customers · orders</text></g>
  <g filter="url(#shadow)"><rect x="62" y="545" width="150" height="86" rx="16" fill="#faf5ff" stroke="#9b76d4" class="box"/><text x="137" y="579" text-anchor="middle" class="head" style="font-size:18px">Content</text><text x="137" y="604" text-anchor="middle" class="sub">Admin</text></g>
  <g filter="url(#shadow)"><rect x="1388" y="545" width="150" height="86" rx="16" fill="#fff3f4" stroke="#ee718d" class="box"/><text x="1463" y="579" text-anchor="middle" class="head" style="font-size:18px">Commerce</text><text x="1463" y="604" text-anchor="middle" class="sub">Admin</text></g>

  <g filter="url(#shadow)"><rect x="330" y="751" width="165" height="68" rx="14" fill="#faf5ff" stroke="#9b76d4" class="box"/><text x="412" y="780" text-anchor="middle" class="head" style="font-size:18px">D1</text><text x="412" y="803" text-anchor="middle" class="sub">Database</text><rect x="520" y="751" width="165" height="68" rx="14" fill="#faf5ff" stroke="#9b76d4" class="box"/><text x="602" y="780" text-anchor="middle" class="head" style="font-size:18px">R2</text><text x="602" y="803" text-anchor="middle" class="sub">Media storage</text></g>
  <g filter="url(#shadow)"><rect x="915" y="751" width="145" height="68" rx="14" fill="#fff3f4" stroke="#ee718d" class="box"/><text x="987" y="780" text-anchor="middle" class="head" style="font-size:18px">PostgreSQL</text><text x="987" y="803" text-anchor="middle" class="sub">Data</text><rect x="1080" y="751" width="105" height="68" rx="14" fill="#fff3f4" stroke="#ee718d" class="box"/><text x="1132" y="792" text-anchor="middle" class="head" style="font-size:18px">Redis</text><rect x="1205" y="751" width="105" height="68" rx="14" fill="#fff3f4" stroke="#ee718d" class="box"/><text x="1257" y="792" text-anchor="middle" class="head" style="font-size:18px">Stripe</text></g>

  <g filter="url(#shadow)"><rect x="440" y="837" width="720" height="46" rx="14" fill="url(#dark)"/><text x="800" y="866" text-anchor="middle" class="footer"><tspan fill="#ffca2b">Payload</tspan><tspan fill="#fff"> controls content.  </tspan><tspan fill="#ffca2b">Medusa</tspan><tspan fill="#fff"> controls commerce.  </tspan><tspan fill="#ffca2b">Frontend</tspan><tspan fill="#fff"> brings both together.</tspan></text></g>
</svg>
